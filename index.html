<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소비자보호 Daily Brief</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-row">
    <h1 class="masthead-title">소비자보호 Daily Brief</h1>
    <div class="masthead-meta">
      <div class="masthead-date mono" id="mastDate">불러오는 중…</div>
      <div>금융당국 · 생명보험 · 손해보험 · 삼성금융사 · GA사 동향 — 최신순</div>
    </div>
  </div>
</header>

<div class="wrap">

  <section class="highlight">
    <div class="highlight-grid">
      <div>
        <div class="highlight-head">
          <p class="highlight-block-title" id="yesterdayTitle">최신 업데이트</p>
          <button class="refresh-btn" id="refreshBtn" type="button">
            <svg id="refreshIcon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            <span id="refreshLabel">새로고침</span>
          </button>
        </div>
        <ul class="pick-list" id="yesterdayList">
          <li class="pick-item"><div class="pick-bar teal"></div><div><p class="pick-reason">불러오는 중…</p></div></li>
        </ul>
      </div>
      <div>
        <p class="highlight-block-title">최근 동향 요약</p>
        <div class="trend-text" id="trendText">
          <p>기사 데이터를 불러오는 중입니다…</p>
        </div>
      </div>
    </div>
  </section>

  <section class="search">
    <div class="search-box">
      <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="회사·기관명 또는 기사 내용으로 검색" autocomplete="off">
    </div>
  </section>

  <section class="archive-toggle-wrap">
    <button class="archive-toggle" id="archiveToggle" type="button">
      <span class="archive-toggle-label" id="archiveToggleLabel">전체 기사 보기</span>
      <svg class="chevron" id="archiveChevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
    <div class="archive-body" id="archiveBody" hidden>
      <section class="tabs" id="tabs"></section>
      <section class="feed" id="feed"></section>
    </div>
  </section>

</div>

<footer>
  각 항목은 언론 보도를 근거로 <b>AI가 사실 위주로 재구성한 요약</b>이며 원문 표현을 그대로 옮기지 않았습니다.
  정확한 인용·수치 확인은 <b>원문 보기</b>를 이용해 주세요.<br><br>
  <span id="footerUpdated">이 화면은 자동 수집된 데이터를 표시합니다.</span>
  매일 한국시간 기준 오전 자동으로 최신 기사가 수집·요약되어 갱신됩니다.
</footer>

<script src="/assets/app.js"></script>
</body>
</html>
